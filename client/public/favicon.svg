<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>

    <!-- Glass Glow Overlay -->
    <linearGradient id="glassGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Trendline Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FACC15"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar1Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="bar2Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bar3Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#34D399" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with subtle border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#glassGlow)" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.25" />

  <!-- Inner Content Group -->
  <g id="spend-analytics-icon">
    <!-- Chart Analytics Bars (3 bars rising) -->
    <!-- Bar 1 (Left - Spend) -->
    <rect x="108" y="280" width="60" height="120" rx="18" fill="url(#bar1Grad)" opacity="0.95"/>
    <!-- Bar 2 (Middle - Budget) -->
    <rect x="200" y="210" width="60" height="190" rx="18" fill="url(#bar2Grad)" opacity="0.95"/>
    <!-- Bar 3 (Right - Savings Growth) -->
    <rect x="292" y="140" width="60" height="260" rx="18" fill="url(#bar3Grad)" opacity="0.95"/>

    <!-- Dynamic Upward Trendline / Growth Curve -->
    <path d="M 100 320 Q 200 240 270 190 T 390 100" 
          fill="none" 
          stroke="url(#trendGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowFilter)" />

    <!-- Upward Trend Arrow Tip -->
    <path d="M 345 95 L 405 92 L 400 152" 
          fill="none" 
          stroke="#FACC15" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#glowFilter)" />

    <!-- Accent Currency / Sparkle at Peak -->
    <circle cx="270" cy="190" r="14" fill="#FFFFFF" filter="url(#glowFilter)" />
    <circle cx="160" cy="275" r="12" fill="#FFFFFF" opacity="0.9" />

    <!-- Rupee / Dollar Coin in top left badge -->
    <g transform="translate(76, 76)">
      <circle cx="36" cy="36" r="36" fill="#FACC15" stroke="#FEF08A" stroke-width="4" filter="url(#dropShadow)" />
      <!-- Stylized Currency Mark -->
      <path d="M 24 24 L 48 24 M 24 33 L 44 33 M 24 24 C 40 24 40 43 24 44 L 46 54" 
            stroke="#854D0E" 
            stroke-width="5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />
    </g>
  </g>
</svg>